[project]
name = "energy-forecast"
version = "0.1.0"
description = "Advisory household energy forecasts and conservative export planning"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "numpy>=2.2,<3", "pandas>=2.2,<4", "pvlib>=0.13,<1", "pyarrow>=19,<25", "holidays>=0.70,<1", "icalendar>=6,<8", "lightgbm>=4.6,<5"]

[project.optional-dependencies]
cnn = ["torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
