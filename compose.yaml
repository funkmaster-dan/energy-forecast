services:
  energy-forecast:
    build: .
    image: localhost/energy-forecast:0.1.0
    ports:
      - "${ENERGY_BIND_ADDRESS:-127.0.0.1}:${ENERGY_HOST_PORT:-18080}:8080"
    environment:
      ENERGY_DATA_DIR: /data
      ENERGY_COOKIE_SECURE: "${ENERGY_COOKIE_SECURE:-false}"
      ENERGY_PUBLIC_ORIGIN: "${ENERGY_PUBLIC_ORIGIN:-http://127.0.0.1:18080}"
    volumes:
      - energy-data:/data
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  energy-data:
